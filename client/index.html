<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Same rule as i18n/LangContext initialLang, before first paint, so a
         Hebrew reader never sees the page laid out left to right first. -->
    <script>
      try {
        var l = localStorage.getItem('lang');
        if (l !== 'en' && l !== 'he') l = /^(he|iw)\b/i.test(navigator.language || '') ? 'he' : 'en';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
    <title>CareerPredict | The Forecast Issue</title>
    <meta
      name="description"
      content="Answer five questions and land on the cover of a career magazine that does not exist. A satirical career forecast with an AI-generated portrait."
    />
    <meta name="theme-color" content="#f3f4f1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CareerPredict | The Forecast Issue" />
    <meta
      property="og:description"
      content="Your career, predicted with unwarranted confidence. Five questions, one cover story."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Inline so the first paint matches the app before any CSS loads. */
      html,
      body {
        margin: 0;
        background: #f3f4f1;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f3f4f1;
        transition: opacity 0.4s ease;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash span {
        font:
          600 2rem/1 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.035em;
        color: #13203a;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><span translate="no">CareerPredict</span></div>
    <div id="root"></div>
    <noscript>CareerPredict needs JavaScript to print your cover.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
